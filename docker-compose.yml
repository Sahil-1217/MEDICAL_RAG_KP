version: '3.8'

services:
  medical-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical_rag_system
    restart: unless-stopped
    ports:
      # Map container port 7860 to host port 7860 (and 8501 for convenience)
      - "7860:7860"
      - "8501:7860"
    env_file:
      - .env
    volumes:
      # Persistent storage: mounts your local 'data' folder
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=7860
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
